# Release: when you push a tag like v0.5.2, build fully static Linux binaries
# for x86_64 and ARM64 (they run on any distro), run the tests, and publish a
# GitHub release with both attached.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Make sure the tag matches the version in CMakeLists.txt
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cmake_version=$(grep -oP 'project\(potter VERSION \K[0-9.]+' CMakeLists.txt)
          if [ "$tag" != "$cmake_version" ]; then
            echo "Tag v$tag does not match CMakeLists.txt version $cmake_version"
            exit 1
          fi

      - name: Build a static binary in Alpine (musl) and run the tests
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            alpine:3.21 sh packaging/build-static.sh

      - name: Package
        # No version in the file name, so "releases/latest/download/..." links
        # in the README always point at the newest release.
        run: |
          name="potter-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp build-static/potter README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Keep the package for the release job
        uses: actions/upload-artifact@v7
        with:
          name: potter-linux-${{ matrix.arch }}
          path: potter-linux-${{ matrix.arch }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" potter-linux-*.tar.gz* \
            --repo "$GITHUB_REPOSITORY" \
            --title "potter $GITHUB_REF_NAME" \
            --generate-notes
