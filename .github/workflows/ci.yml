# CI: build potter and run the tests on every push and pull request.
# Results show up as ✅ / ❌ next to each commit on GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check --version
        run: ./build/potter --version

  # macOS (Apple Silicon), for the Homebrew formula.
  macos:
    runs-on: macos-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check --version
        run: ./build/potter --version

  # The same static (musl) build the release uses, so a problem shows up on
  # a normal push instead of on release day.
  static:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Build a static binary in Alpine (musl) and run the tests
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            alpine:3.21 sh packaging/build-static.sh
